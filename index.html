<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>SIMPEG - Administrasi Akademis</title>
   <link rel="stylesheet" href="https://cloudflare.com">
  
</head>
<body class="bg-light p-4">
<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="text-primary fw-bold mb-0">Sistem Informasi Kepegawaian (SIMPEG)</h3>
      <small class="text-muted">Unit Layanan Administrasi Akademis Kampus</small>
    </div>
    <span class="badge bg-success">Cloud Connected: Supabase</span>
  </div>

  <div class="card mb-4 shadow-sm">
    <div class="card-header bg-primary text-white">Tambah Pegawai Administrasi Akademis</div>
    <div class="card-body">
      <form id="formPegawai" class="row g-2">
        <div class="col-md-2"><input type="text" id="nip" class="form-control" placeholder="NIP (ADM0051)" required></div>
        <div class="col-md-3"><input type="text" id="nama" class="form-control" placeholder="Nama Lengkap" required></div>
        <div class="col-md-3"><input type="email" id="email" class="form-control" placeholder="Email (@kampus.ac.id)" required></div>
        <div class="col-md-2">
          <select id="dept" class="form-select">
            <option value="1">BAAK</option>
            <option value="2">BAUK</option>
            <option value="3">Fakultas/Prodi</option>
            <option value="4">Perpustakaan</option>
            <option value="5">IT & PDDIKTI</option>
          </select>
        </div>
        <div class="col-md-2">
          <select id="status" class="form-select">
            <option value="Tetap">Tetap</option>
            <option value="Kontrak">Kontrak</option>
            <option value="Magang">Magang</option>
          </select>
        </div>
        <div class="col-12 mt-2"><button type="submit" class="btn btn-success btn-sm">Simpan ke Cloud</button></div>
      </form>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="card-header bg-white fw-bold">Daftar Pegawai Administrasi Akademis (<span id="totalData">0</span> Pegawai)</div>
    <div class="card-body table-responsive">
      <table class="table table-bordered table-striped align-middle">
        <thead class="table-dark">
          <tr><th>No</th><th>NIP</th><th>Nama</th><th>Email</th><th>Unit Kerja</th><th>Jabatan</th><th>Status</th><th>Aksi</th></tr>
        </thead>
        <tbody id="tabelPegawai"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const URL_DB = 'https://supabase.co';
  const API_KEY = 'TEMPEL_KEY_SUPABASE';
  const HEADERS = {
    'apikey': API_KEY,
    'Authorization': 'Bearer ' + API_KEY,
    'Content-Type': 'application/json'
  };

  async function loadPegawai() {
    const res = await fetch(`${URL_DB}/pegawai?select=*,departemen(nama_dept),jabatan(nama_jabatan)&order=nip.asc`, { headers: HEADERS });
    const data = await res.json();
    if (!res.ok) return alert('Error: ' + JSON.stringify(data));

    document.getElementById('totalData').innerText = data.length;
    document.getElementById('tabelPegawai').innerHTML = data.map((p, i) => `
      <tr>
        <td>${i + 1}</td>
        <td><b>${p.nip}</b></td>
        <td>${p.nama_lengkap}</td>
        <td>${p.email}</td>
        <td>${p.departemen ? p.departemen.nama_dept : '-'}</td>
        <td>${p.jabatan ? p.jabatan.nama_jabatan : '-'}</td>
        <td><span class="badge bg-info text-dark">${p.status_kerja}</span></td>
        <td><button class="btn btn-danger btn-sm" onclick="hapus('${p.id_pegawai}')">Hapus</button></td>
      </tr>`).join('');
  }

  document.getElementById('formPegawai').onsubmit = async (e) => {
    e.preventDefault();
    const res = await fetch(`${URL_DB}/pegawai`, {
      method: 'POST',
      headers: HEADERS,
      body: JSON.stringify({
        nip: nip.value,
        nama_lengkap: nama.value,
        email: email.value,
        id_dept: parseInt(dept.value),
        id_jabatan: 4,
        status_kerja: status.value,
        tgl_masuk: new Date().toISOString().split('T')[0]
      })
    });
    if (!res.ok) alert('Gagal simpan!'); else { e.target.reset(); loadPegawai(); }
  };

  async function hapus(id) {
    if (!confirm('Hapus data ini?')) return;
    await fetch(`${URL_DB}/pegawai?id_pegawai=eq.${id}`, { method: 'DELETE', headers: HEADERS });
    loadPegawai();
  }

  loadPegawai();
</script>
</body>
</html>
